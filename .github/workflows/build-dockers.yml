name: Dockers
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Docker image tag"
        required: true
        type: string
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldclabs/anda_brain
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin "$REGISTRY"
          image="${REGISTRY}/${IMAGE_NAME}_amd64"
          docker build -f anda_brain/Dockerfile --tag "$image:$BUILD_TAG" --tag "$image:latest" --push .
