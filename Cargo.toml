[workspace]
resolver = "2"
members = ["anda_brain"]

[workspace.package]
description = "🧠 Anda Brain (大脑) — Autonomous Graph Memory for AI Agents"
repository = "https://github.com/ldclabs/anda-brain"
homepage = "https://github.com/ldclabs/anda-brain"
keywords = [
  "knowledge-graph",
  "persistent-memory",
  "cognitive",
  "kip",
  "agent-memory",
]
categories = [
  "accessibility",
  "web-programming",
  "development-tools",
  "text-processing",
]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = [
  "http1",
  "http2",
  "json",
  # "macros",
  "matched-path",
  "tokio",
  "query",
], default-features = true }
# 0.17 drops remote engines from the context traits (`tool_call` returns the
# output alone) and has `handoff` resume a compaction it interrupted itself.
anda_core = "0.17.3"
anda_engine = "0.18"
anda_object_store = "0.14.1"
anda_db = { version = "0.14", features = ["full"] }
anda_db_tfs = { version = "0.14", features = ["full"] }
anda_cognitive_nexus = "0.15"
anda_kip = "0.15"
cbor2 = "1"
jiff = { version = "1", default-features = false }
cose2 = "0.6"
dotenv = "0.15"
futures = "0.3"
http = "1.5"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde-saphyr = "2"
sha3 = "0.12"
sha2 = "0.11"
unicode-normalization = "0.1"
ic_cose_types = "0.12"
ic_auth_types = "0.10"
object_store = { version = "0.14" }
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
structured-logger = "1"
log = { version = "0.4", features = ["kv_serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors"] }
# recall_budget::TOKENIZER names the o200k encoding of the tiktoken-rs 0.12 line:
# patch releases only. A release that changes the encoding needs a new identity.
tiktoken-rs = "0.12.1"
# 0.1.49 made mimalloc v3 the default (the `v3` feature is gone; `v2` opts back).
mimalloc = { version = "0.1.52" }
rand = "0.10"
rmcp = { version = "3", features = [
  "macros",
  "schemars",
  "server",
  "transport-io",
  "transport-streamable-http-server",
], default-features = false }
schemars = "1"

# Optional local overrides: enable the shared DB/KIP stack together, and the
# Anda engine built against it.
[patch.crates-io]
# anda_core = { path = "../anda/anda_core" }
# anda_engine = { path = "../anda/anda_engine" }
# anda_cognitive_nexus = { path = "../anda-db/rs/anda_cognitive_nexus" }
# anda_db = { path = "../anda-db/rs/anda_db" }
# anda_db_schema = { path = "../anda-db/rs/anda_db_schema" }
# anda_db_tfs = { path = "../anda-db/rs/anda_db_tfs" }
# anda_db_utils = { path = "../anda-db/rs/anda_db_utils" }
# anda_object_store = { path = "../anda-db/rs/anda_object_store" }
# anda_kip = { path = "../anda-db/rs/anda_kip" }

[profile.dev.package."*"]
# Shrink dependency code and unwind tables so macOS debug builds fit the
# compact-unwind format's 24-bit DWARF offsets (16 MiB). Keep anda_brain itself
# unoptimized for debugging, and retain debug info and panic unwinding.
# The test profile inherits this override from dev.
opt-level = 1

[profile.release]
debug = false
lto = true
strip = true
opt-level = 'z'
codegen-units = 1
panic = "abort"
